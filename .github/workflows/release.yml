name: Reviewable native release artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 2
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned Rust
        shell: bash
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: ./scripts/setup-linux.sh
      - name: Configure Windows C++ compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$installation) { throw 'Visual Studio C++ tools were not found' }
          $batch = Join-Path $installation 'VC\Auxiliary\Build\vcvars64.bat'
          cmd /c "`"$batch`" >nul && set" | ForEach-Object {
            if ($_ -match '^(Path|INCLUDE|LIB|LIBPATH|VCINSTALLDIR|VCToolsInstallDir|WindowsSdkDir|WindowsSDKVersion|UCRTVersion|UniversalCRTSdkDir|VSINSTALLDIR)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
      - uses: actions/cache@v6.1.0
        with:
          path: target/toolchain
          key: llvm-18.1.8-3b5b5c1-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-toolchain.py') }}
      - name: Build pinned toolchain
        run: python scripts/build-toolchain.py --jobs 2 --clean-build
      - name: Select the pinned toolchain for tests
        shell: python
        run: |
          import os
          from pathlib import Path
          suffix = ".exe" if os.name == "nt" else ""
          root = Path("target/toolchain/bin").resolve()
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"VOLE_LLVM_MC={root / ('llvm-mc' + suffix)}\n")
              output.write(f"VOLE_LLD={root / ('ld.lld' + suffix)}\n")
      - name: Test every guest and native code
        run: cargo test --workspace --locked
      - name: Build native release
        run: cargo build --release --locked -p vole-app -p vole-cli
      - name: Bundle tools and notices; test every packaged guest
        run: python scripts/package.py --toolchain-dir target/toolchain
      - name: Capture actual Linux GPUI window
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1800x1200x24 -noreset' python scripts/verify-native.py --start-window-manager --start-compositor --binary dist/vole-*-linux-x64/vole
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: vole-native-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/native-evidence
          if-no-files-found: error
