name: Linux release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the Linux build to, e.g. v0.1.1
        required: true
permissions:
  contents: write
jobs:
  # ponytail: macOS builds are made locally (make mac-build PROFILE=release);
  # this only adds the Linux tarballs the Homebrew cask installs on Linux.
  linux:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.TAG }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config libssl-dev libfontconfig1-dev libfreetype6-dev \
            libx11-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libvulkan-dev libegl1-mesa-dev
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.0 --profile minimal
      - run: cargo build --release --locked -p vole-app -p vole-cli
      - name: Package
        run: |
          version="${TAG#v}"
          out="dist/vole"
          mkdir -p "$out/bin"
          cp target/release/vole target/release/vole-cli "$out/bin/"
          cp packaging/linux/vole.png "$out/vole.png"
          for name in vole vole-cli; do
            # Put Homebrew's keg LLVM and LLD first so desktop launches find them.
            cat > "$out/$name" <<EOF
          #!/bin/sh
          here=\$(dirname "\$(readlink -f "\$0")")
          prefix=\${here%/Caskroom/*}
          PATH="\$prefix/opt/llvm/bin:\$prefix/opt/lld/bin:\$prefix/bin:\$PATH" exec "\$here/bin/$name" "\$@"
          EOF
            chmod +x "$out/$name"
          done
          # ponytail: assumes the default Linuxbrew prefix for the launcher path.
          cat > "$out/dev.vole.Workbench.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=Vole
          Comment=Assemble and simulate teaching machines
          Exec=/home/linuxbrew/.linuxbrew/bin/vole
          Icon=dev.vole.Workbench
          Terminal=false
          Categories=Development;Education;
          StartupWMClass=dev.vole.Workbench
          EOF
          "$out/vole-cli" --help | head -1
          tar -C dist -czf "dist/vole-$version-linux-${{ matrix.arch }}.tar.gz" vole
          sha256sum "dist/vole-$version-linux-${{ matrix.arch }}.tar.gz"
      - run: gh release upload "$TAG" dist/vole-*-linux-${{ matrix.arch }}.tar.gz --clobber
